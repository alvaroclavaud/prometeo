name: Recogida de Prometeo

on:
  schedule:
    # Los turnos de recogida son a las 6:12, 12:12, 18:12 y 23:12, hora de España, todo el año (la de las 23:12
    # cierra las cifras del día). GitHub trabaja en hora UTC y su programador puede retrasarse horas, así que el
    # flujo se despierta cada hora (y cada media hora de madrugada) y el paso «Turno» decide: si los datos
    # publicados son anteriores al último turno previsto, recoge; si están al día, termina en unos segundos.
    # Así un despertar que llega tarde, o un turno que falló, se recupera solo en el siguiente despertar.
    - cron: '12 * * * *'
    - cron: '42 3-6 * * *'
  workflow_dispatch:
    inputs:
      reclasificar:
        description: 'Volver a clasificar todos los titulares (no reutiliza las etiquetas ya publicadas)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: recogida
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Turno (¿toca recoger ahora?)
        id: turno
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'EOF'
          import calendar, json, os
          from datetime import datetime, timedelta, timezone
          ahora = datetime.now(timezone.utc)
          try:
              from zoneinfo import ZoneInfo
              desfase = ahora.astimezone(ZoneInfo('Europe/Madrid')).utcoffset()
          except Exception:                      # sin base de zonas horarias: regla europea del horario de verano
              def cambio(mes):
                  d = calendar.monthrange(ahora.year, mes)[1]
                  while datetime(ahora.year, mes, d).weekday() != 6: d -= 1
                  return datetime(ahora.year, mes, d, 1, tzinfo=timezone.utc)
              desfase = timedelta(hours=2 if cambio(3) <= ahora < cambio(10) else 1)
          local = ahora + desfase                # reloj de pared en España
          turnos = [(local - timedelta(days=d)).replace(hour=h, minute=12, second=0, microsecond=0) for d in (0, 1) for h in (6, 12, 18, 23)]
          ultimo = max(t for t in turnos if t <= local)       # último turno que ya debería estar hecho
          try: gen = datetime.fromisoformat(json.load(open('data/estado.json'))['generado'].replace('Z', '+00:00')) + desfase
          except Exception: gen = None
          toca = gen is None or gen < ultimo - timedelta(minutes=45)
          print('Hora en España: %s · último turno previsto: %s · última recogida publicada: %s · %s' % (local.strftime('%H:%M'), ultimo.strftime('%d-%m %H:%M'), gen.strftime('%d-%m %H:%M') if gen else 'ninguna', 'se recoge' if toca else 'al día, se salta'))
          if not toca: open(os.environ['GITHUB_OUTPUT'], 'a').write('saltar=1\n')
          EOF
      - uses: actions/setup-python@v5
        if: steps.turno.outputs.saltar != '1'
        with:
          python-version: '3.12'
      - name: Dependencias
        if: steps.turno.outputs.saltar != '1'
        run: pip install --quiet requests beautifulsoup4 tzdata
      - name: Recoger fuentes públicas
        if: steps.turno.outputs.saltar != '1'
        working-directory: pipeline
        run: python recoger.py
      - name: Preparar muestra
        if: steps.turno.outputs.saltar != '1'
        working-directory: pipeline
        run: python prom.py muestra
      - name: Clasificar titulares (solo si existe el secreto GEMINI_API_KEY; si falla, se publica igualmente)
        if: steps.turno.outputs.saltar != '1'
        working-directory: pipeline
        continue-on-error: true
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROM_RECLASIFICAR: ${{ inputs.reclasificar && '1' || '' }}
        run: python clasificar.py
      - name: Calcular y escribir datos
        if: steps.turno.outputs.saltar != '1'
        working-directory: pipeline
        run: python prom.py publicar --repo --auto-informe
      - name: Publicar
        if: steps.turno.outputs.saltar != '1'
        run: |
          git config user.name "prometeo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Recogida $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase origin main && git push)
