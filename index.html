<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Prometeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="mark" id="marca-logo"><svg viewBox="0 0 24 24"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-1-.4-1.8-.8-2.5C17 10 19 12.600 19 15.500A7 7 0 0 1 5 15.500C5 10 10 8 12 2z"/></svg></span><div><b id="marca-nombre">Prometeo</b><small>Escucha social y política</small></div></div>
    <nav id="nav">
      <a href="#resumen" data-v="resumen">Resumen</a>
      <a href="#politicos" data-v="politicos">Políticos</a>
      <a href="#temas" data-v="temas">Temas y zonas</a>
      <a href="#menciones" data-v="menciones">Menciones</a>
      <a href="#redes" data-v="redes">Redes y tendencias</a>
      <hr>
      <a href="#informe" data-v="informe">Informe diario</a>
      <a href="#tarjetas" data-v="tarjetas">Tarjetas para redes</a>
      <a href="#impacto" data-v="impacto">Impacto</a>
      <hr>
      <a href="#ajustes" data-v="ajustes">Ajustes</a>
    </nav>
    <div class="foot"><span id="pie-fecha"></span><span id="pie-cob"></span></div>
  </aside>
  <div class="main">
    <div class="top">
      <div class="seg" id="rango" role="group" aria-label="Periodo">
        <button data-r="24h" class="on">24 h</button><button data-r="7d">7 días</button><button data-r="30d">30 días</button><button data-r="1a">1 año</button><button data-r="pers">Fechas</button>
      </div>
      <span id="pers" class="row hide"><input type="date" id="f-desde" class="inp" aria-label="Desde"><input type="date" id="f-hasta" class="inp" aria-label="Hasta"></span>
      <span class="muted small" id="rango-nota"></span>
      <span class="sp"></span>
      <span class="cuenta" id="cuenta"></span>
      <button class="btn bell" id="btn-alertas" aria-label="Alertas">Alertas <i id="n-alertas" class="hide">0</i></button>
    </div>
    <main class="wrap" id="vista"><div class="load">Cargando datos…</div></main>
  </div>
</div>
<div class="velo" id="velo"></div>
<aside class="drawer" id="drawer" aria-label="Panel lateral"></aside>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
