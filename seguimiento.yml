# ==========================================================================================
#  PROMETEO · QUÉ SE SIGUE
#  Este es el único fichero que hay que tocar para cambiar a quién, qué y dónde se escucha.
#  Cómo editarlo: en GitHub, abre este fichero y pulsa el lápiz («Edit this file»); al terminar,
#  «Commit changes». La siguiente recogida (como mucho en unas horas) ya usa los cambios.
#  Si te equivocas al escribir, no se rompe nada: la recogida sigue con la última versión buena
#  y el panel muestra un aviso con la línea del error.
#  Reglas: respeta la sangría (espacios, nunca tabuladores); el texto con dos puntos o comillas
#  va entre comillas simples; para quitar algo, borra su bloque entero.
# ==========================================================================================

elecciones:
  nombre: Elecciones generales 29-N
  fecha: '2026-11-29'          # AAAA-MM-DD
  inicio_campana: '2026-11-13'

# Seguimiento en profundidad (hasta 5): se consulta además cada cabecera, Bluesky, YouTube y Telegram.
nivel1: [sanchez, feijoo, abascal, colau]

# Color de cada partido en el panel (formato #rrggbb).
