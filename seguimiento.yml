# Temas. consulta: búsqueda en Google News; patron: palabras que lo identifican en un titular
# (expresión regular); foco: lugares con seguimiento propio; mapa: ventana del mapa por provincias
# (7d, 2d o vacío para no hacer mapa; cada tema con mapa añade 52 consultas); bluesky: búsqueda.
temas:
  - id: inseguridad
    nombre: Inseguridad
    consulta: (inseguridad OR delincuencia OR criminalidad OR robos)
    patron: 'insegur|delincuen|criminal|\brobo|atraco|okupa|narco|apuñal|tiroteo|homicid|asesin|agresi[oó]n|violaci[oó]n|detenid|\bbanda'
    foco: [Ceuta]
    mapa: '7d'
    bluesky: inseguridad
  - id: economia
    nombre: Economía
    consulta: (economía OR empleo OR paro OR vivienda OR inflación)
    patron: 'econom|empleo|\bparo\b|vivienda|alquiler|inflaci|precio|salario|pension|impuest|hipoteca|\bPIB\b|eur[ií]bor|presupuest|huelga'
    foco: [Madrid, Barcelona]
    mapa: '2d'
    bluesky: vivienda
  - id: inmigracion
    nombre: Inmigración
    consulta: (inmigración OR inmigrantes OR migrantes OR pateras OR cayucos)
    patron: 'inmigra|migrant|patera|cayuco|menores no acompañados|\bmenas\b|frontera|asilo|deportac|regulariza'
    foco: [España]
    mapa: '7d'
    bluesky: inmigración
  - id: campana
    nombre: Campaña 29-N
    consulta: '(elecciones generales OR "29-N" OR campaña electoral OR sondeo)'
    patron: 'eleccion|29-?N|campaña|sondeo|encuesta|mitin|debate|candidat|\bvoto|urnas|escaños'
    foco: [España]
    mapa: ''
    bluesky: elecciones generales

